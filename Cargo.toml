[package]
name = "mdglass"
version = "0.1.0"
edition = "2021"
description = "Super fast, minimal terminal markdown viewer"
license = "MIT"
repository = "https://github.com/hpn777/mdglass"

[dependencies]
termion = "4"
# GUI diagram engines (docs/diagram-engine-options.md): ASCII art -> vector SVG,
# and a native Mermaid renderer. Both are pure Rust, both fail soft.
aasvg = "1"
mermaid-rs-renderer = { version = "0.3", default-features = false }

[profile.dev.package.mermaid-rs-renderer]
opt-level = 1  # its debug build is very slow to parse

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"  # the GUI catch_unwinds the diagram engines; do not abort
