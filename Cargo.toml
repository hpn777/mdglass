[package]
name = "mdglass"
version = "0.1.0"
edition = "2021"
description = "Super fast, minimal terminal markdown viewer"
license = "MIT"
repository = "https://github.com/hpn777/mdglass"

[dependencies]
termion = "4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
